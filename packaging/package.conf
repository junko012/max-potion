# Metadatos de los paquetes .deb y .rpm de Max Potion. EDITA ESTE ARCHIVO y description.txt.
# Formato: CLAVE = valor (una línea). Las líneas que empiezan con # son comentarios.

# Nombre del paquete (minúsculas, sin espacios). Coincide con el ejecutable y con /usr/share/<nombre>/.
name        = maxpotion
# Nombre que se ve en el menú de aplicaciones
title       = Max Potion
# Resumen de UNA línea: es lo primero que se ve al instalar (apt show, zypper info, dnf info)
summary     = Offline Pokémon save editor with real-time legality checking
# Creador: aparece como Vendor/Packager del rpm y en la descripción
creator     = junko012
homepage    = https://github.com/junko012/max-potion
license     = GPL-3.0-or-later
# Quien aparece como mantenedor del .deb (formato: Nombre <correo>)
maintainer  = junko012 <junko012@users.noreply.github.com>
# deb: sección y prioridad de Debian
section     = games
priority    = optional

# Dependencias de ejecución (versiones mínimas). El ejecutable ya trae .NET (self-contained).
# Se separan con coma; las alternativas de un deb con |
deb_depends = libc6 (>= 2.31), libstdc++6 (>= 10), libgcc-s1, libx11-6, libice6, libsm6, libfontconfig1, libicu76 | libicu74 | libicu72 | libicu70 | libicu67 | libicu66
# rpm: se piden por nombre de LIBRERÍA (soname), no por nombre de paquete, porque openSUSE y Fedora nombran distinto
# los paquetes (libICE6 / libICE) pero ambos proveen la misma librería.
rpm_requires = libc.so.6()(64bit), libstdc++.so.6()(64bit), libX11.so.6()(64bit), libICE.so.6()(64bit), libSM.so.6()(64bit), libfontconfig.so.1()(64bit)
# Dependencias débiles (se instalan si existen, no bloquean si el nombre no existe en la distro). .NET necesita ICU en ejecución.
rpm_recommends = libicu
